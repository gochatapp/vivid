<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Chat - Web Chat</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <div class="bot-selector">
                <label for="bot-select">Bot:</label>
                <select id="bot-select" onchange="switchBot()">
                    <option value="">Select a bot...</option>
                </select>
            </div>
            <div class="bot-status" id="bot-status">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Disconnected</span>
            </div>
        </header>

        <main class="chat-main">
            <div class="messages" id="messages">
                <!-- Messages will be appended here -->
            </div>
        </main>

        <footer class="chat-footer">
            <div class="input-group">
                <select id="command-select" style="display: none;">
                    <option value="">Send as message</option>
                    <option value=".help">.help</option>
                    <option value=".status">.status</option>
                    <option value=".role">.role</option>
                    <option value=".model">.model</option>
                    <option value=".provider">.provider</option>
                    <option value=".persona">.persona</option>
                    <option value=".story">.story</option>
                    <option value=".char">.char</option>
                    <option value=".element">.element</option>
                </select>
                <input type="text" id="message-input" placeholder="Type a message or command (starting with .)..." autocomplete="off">
                <button id="send-btn" onclick="sendMessage()">Send</button>
            </div>
            <div class="quick-actions" id="quick-actions">
                <!-- Quick action buttons will be populated based on selected bot -->
            </div>
        </footer>
    </div>

    <script src="/static/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadBotsForChat();
            setupMessageInput();
        });
    </script>
</body>
</html>
