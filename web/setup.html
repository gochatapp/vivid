<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Setup - Character.XI</title>
<!-- Tailwind CSS CDN for modern styling -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- FontAwesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #0f172a; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #475569; }

  /* Form controls share the Role Maker palette: #0b1017 wells on #161f2e cards. */
  select, input:not([type="checkbox"]):not([type="radio"]) {
    width: 100%;
    box-sizing: border-box;
    background-color: #0b1017 !important;
    border: 1px solid #1e293b !important;
    border-radius: 12px;
    color: #f1f5f9 !important;
    padding: 8px 12px;
    font-size: 13px;
    transition: all 0.2s ease;
  }
  select:focus, input:not([type="checkbox"]):not([type="radio"]):focus {
    border-color: #6366f1 !important;
    outline: none !important;
    box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2) !important;
  }

  label { display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin: 0 0 6px; }

  /* Rows generated by setup.js (bots / providers). */
  .bot, .prov { background: #0f172a; border: 1px solid rgba(30, 41, 59, 0.8); border-radius: 16px; padding: 16px; margin: 12px 0; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .bot label, .prov label { font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 6px; }
  .bot .keyhint, .prov .keyhint { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 10px; color: #64748b; }

  /* Fetched model picker: the filter box rides the same line as the select so the
     Models/Test/Delete buttons underneath never move down. */
  .modelline { display: flex; gap: 8px; align-items: stretch; }
  .modelline select, .modelline input { min-width: 0; }
  .modelline select { flex: 1 1 60%; }
  .modelline input { flex: 1 1 40%; width: auto; }

  /* Row actions (Models / Test / Delete) generated by setup.js. */
  .bot button, .prov button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #1e293b;
    border: 1px solid #334155;
    color: #e2e8f0;
    padding: 6px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    margin: 10px 8px 0 0;
    transition: all 0.2s ease;
  }
  .bot button:hover, .prov button:hover { background: #27364b; border-color: #475569; }

  .ok { color: #22c55e; }
  .err { color: #f87171; }
  .muted, .msgmuted { color: #94a3b8; font-size: 12px; }
  .hint { font-size: 11px; color: #64748b; line-height: 1.6; }
  code { background: #0b1017; border: 1px solid #1e293b; border-radius: 6px; padding: 1px 5px; font-size: 0.95em; color: #c7d2fe; }
  a { color: #818cf8; }

  @media (max-width: 640px) {
    .row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body class="bg-[#0b0f17] text-slate-200 min-h-screen flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Header Navigation -->
  <header class="border-b border-slate-800/80 bg-[#0f172a]/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="h-9 w-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-blue-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-sliders font-bold text-white text-lg"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white leading-tight">Setup</h1>
          <p class="text-xs text-slate-400">Character.XI · Telegram bots, providers &amp; tokens</p>
        </div>
      </div>
      <a href="/" class="inline-flex items-center gap-2 px-3.5 py-1.5 text-xs font-medium text-slate-300 hover:text-white bg-slate-800/70 hover:bg-slate-700/80 border border-slate-700/60 rounded-lg transition-all">
        <i class="fa-solid fa-arrow-left"></i> Home
      </a>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full">
    <div class="grid grid-cols-1 gap-6 items-start">

      <!-- 1. Telegram -->
      <div class="bg-[#161f2e] border border-slate-800/80 rounded-2xl p-5 shadow-xl space-y-3">
        <h2 class="text-xs font-bold uppercase tracking-wider text-blue-400 flex items-center gap-2">
          <i class="fa-solid fa-paper-plane"></i> 1. Telegram
        </h2>
        <div class="flex flex-col gap-1.5">
          <label for="user_id" class="text-xs font-semibold text-slate-300">Telegram User ID (from @userinfobot)</label>
          <input id="user_id" type="number" placeholder="123456789" class="w-full rounded-xl px-3 py-2 text-sm">
        </div>
        <div id="bots"></div>
        <div class="flex flex-wrap items-center gap-2 pt-1">
          <button type="button" onclick="addBot()" class="py-2.5 px-5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-semibold transition flex items-center gap-1.5">
            <i class="fa-solid fa-plus"></i> Add bot
          </button>
        </div>
      </div>

      <!-- 2. Providers -->
      <div class="bg-[#161f2e] border border-slate-800/80 rounded-2xl p-5 shadow-xl space-y-3">
        <h2 class="text-xs font-bold uppercase tracking-wider text-indigo-400 flex items-center gap-2">
          <i class="fa-solid fa-server"></i> 2. Providers
        </h2>
        <div id="provs"></div>
        <div class="flex flex-wrap items-center gap-2 pt-1">
          <button type="button" onclick="addProv()" class="py-2.5 px-5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-semibold transition flex items-center gap-1.5">
            <i class="fa-solid fa-plus"></i> Add provider
          </button>
        </div>
      </div>

      <!-- 3. GitHub gist token -->
      <div class="bg-[#161f2e] border border-slate-800/80 rounded-2xl p-5 shadow-xl space-y-3">
        <h2 class="text-xs font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-2">
          <i class="fa-brands fa-github"></i> 3. GitHub Gist Token
        </h2>
        <div class="flex flex-col gap-1.5">
          <label for="gist_github_token" class="text-xs font-semibold text-slate-300">Classic Personal Access Token with the gist scope</label>
          <input id="gist_github_token" type="password" class="w-full rounded-xl px-3 py-2 text-sm">
        </div>
        <p class="hint">Used for "Publish to Online Library". This is <em>not</em> the release token (that one lives in <code>executables/.release-token</code>).</p>
      </div>

      <!-- 4. Save -->
      <div class="bg-[#161f2e] border border-slate-800/80 rounded-2xl p-5 shadow-xl space-y-3">
        <h2 class="text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center gap-2">
          <i class="fa-solid fa-floppy-disk"></i> 4. Save
        </h2>
        <label class="inline-flex items-center gap-2 cursor-pointer text-xs font-semibold text-slate-300" style="margin:0">
          <input id="debug" type="checkbox" class="accent-indigo-500" style="width:auto">
          <span>Debug</span>
        </label>
        <div class="flex flex-wrap items-center gap-2 pt-1">
          <button type="button" onclick="save()" class="py-2.5 px-6 rounded-xl bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white font-bold text-sm shadow-lg shadow-indigo-500/10 transition flex items-center gap-2">
            <i class="fa-solid fa-floppy-disk"></i> Save config.yaml
          </button>
          <span id="saveMsg" class="muted"></span>
        </div>
      </div>

    </div>
  </main>

<script src="/static/setup.js"></script>
</body>
</html>
