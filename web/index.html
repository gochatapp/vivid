<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Chat - Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Vivid Chat Dashboard</h1>
            <div class="status-indicator" id="connection-status">
                <span class="dot"></span>
                <span>Connecting...</span>
            </div>
        </header>

        <main>
            <section class="bots-grid" id="bots-grid">
                <!-- Bots will be populated here -->
            </section>

            <section class="actions">
                <a href="/chat" class="btn btn-primary">💬 Open Web Chat</a>
                <button class="btn btn-secondary" onclick="refreshBots()">🔄 Refresh</button>
            </section>
        </main>
    </div>

    <script src="/static/app.js"></script>
    <script>
        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', () => {
            loadBots();
            setInterval(loadBots, 5000); // Auto-refresh every 5 seconds
        });
    </script>
</body>
</html>
