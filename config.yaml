PROVIDERS:
  - name: "local-ollama"
    type: "ollama"
    url: "http://192.168.1.201:11434"
    show_on_provider_list: true
  - name: "local-ollama-2"
    type: "ollama"
    url: "http://192.168.1.202:9931"
    show_on_provider_list: true
  - name: "openrouter"
    type: "openai_compatible"
    url: "https://openrouter.ai/api/v1"
    api_key: "your-openrouter-api-key"
    show_on_provider_list: true
    extra_headers:
      HTTP-Referer: "https://github.com/your-repo"
      X-Title: "Vivid Chat"
  - name: "llamacpp"
    type: "openai_compatible"
    url: "http://192.168.1.162:9931/v1"
