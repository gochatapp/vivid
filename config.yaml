    models_url: "http://192.168.1.162:9931/models"
    show_on_provider_list: true
  - name: "llamacpp-ollama"
    type: "ollama"
    url: "http://localhost:8080"
    show_on_provider_list: true
  - name: "llamacpp-remote"
    type: "openai_compatible"
    url: "https://your-proxy-url/v1"
    api_key: "optional-if-auth-required"
    show_on_provider_list: true
  - name: "gemini"
    type: "gemini"
    api_key: "your-gemini-api-key"
    show_on_provider_list: true

